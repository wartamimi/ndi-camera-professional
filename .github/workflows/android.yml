name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      play_track:
        description: "Upload the signed AAB to this Google Play track as a DRAFT release (none = do not upload)"
        type: choice
        default: none
        options: [none, internal, alpha, beta, production]
      update_listing:
        description: "Upload the store listing text and images from fastlane/metadata/android to Google Play"
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "27.2.12479018"
  CMAKE_VERSION: "3.22.1"

jobs:
  # ---------------------------------------------------------------------------------------
  # 1) Validation build: compiles all Kotlin + the NDI-independent native code and runs
  #    unit tests WITHOUT the proprietary NDI SDK. Its APK is labelled "validation" and
  #    reports "NDI SDK not installed" at runtime. It is NOT an NDI-capable build.
  # ---------------------------------------------------------------------------------------
  validate:
    name: Validation build (no NDI SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build tools, NDK and CMake
        run: |
          # The GitHub-hosted Ubuntu image ships the Android SDK at $ANDROID_HOME.
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;35.0.0" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null
          echo "Installed:"; "$SDKM" --list_installed | grep -E "ndk|cmake|platforms;android-36|build-tools;35"

      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4

      - name: Native media-core unit tests (host, ASan/UBSan)
        run: |
          cmake -S native-tests -B build/native-tests -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/native-tests
          ./build/native-tests/mediacore_test

      - name: Kotlin unit tests
        run: ./gradlew --no-daemon --stacktrace -Pndi.validationBuild=true testDebugUnitTest

      - name: Assemble validation debug APK (Kotlin + C++ compile)
        run: ./gradlew --no-daemon --stacktrace -Pndi.validationBuild=true assembleDebug

      - name: Android lint
        run: ./gradlew --no-daemon -Pndi.validationBuild=true lintDebug
        continue-on-error: true

      - name: Rename validation APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/LCSCam-VALIDATION-no-ndi-debug.apk
          unzip -l out/LCSCam-VALIDATION-no-ndi-debug.apk | grep "lib/" || true

      - uses: actions/upload-artifact@v4
        with:
          name: validation-apk-NOT-NDI-capable
          path: out/*.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

  # ---------------------------------------------------------------------------------------
  # 2) Production NDI build: requires the official NDI SDK for Android, supplied through
  #    the NDI_SDK_URL secret (a private download link to your own copy of the SDK archive).
  #    Fails loudly when the SDK is not configured; never fakes SDK files.
  # ---------------------------------------------------------------------------------------
  ndi-build:
    name: Production build (official NDI SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: validate
    env:
      NDI_SDK_URL: ${{ secrets.NDI_SDK_URL }}
      NDI_SDK_SHA256: ${{ secrets.NDI_SDK_SHA256 }}
      NDI_ABIS: ${{ vars.NDI_ABIS || 'arm64-v8a,armeabi-v7a' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check NDI SDK configuration
        run: |
          if [ -z "${NDI_SDK_URL}" ]; then
            echo "::error title=NDI SDK not configured::The NDI_SDK_URL repository secret is not set. A production NDI APK cannot be built without the official NDI SDK for Android. See docs/NDI_SDK_SETUP.md."
            exit 1
          fi

      - name: Download and install NDI SDK (not committed, not cached)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ndi" && cd "$RUNNER_TEMP/ndi"
          curl -fsSL --retry 3 -o sdk.archive "${NDI_SDK_URL}"
          if [ -n "${NDI_SDK_SHA256}" ]; then
            echo "${NDI_SDK_SHA256}  sdk.archive" | sha256sum -c -
          else
            echo "::warning::NDI_SDK_SHA256 not set; archive integrity not verified."
          fi
          mkdir x
          case "$(file -b --mime-type sdk.archive)" in
            application/zip) unzip -q sdk.archive -d x ;;
            application/gzip|application/x-gzip) tar -xzf sdk.archive -C x ;;
            application/x-xz) tar -xJf sdk.archive -C x ;;
            application/x-tar) tar -xf sdk.archive -C x ;;
            *) echo "::error::Unsupported NDI SDK archive type: $(file -b sdk.archive)"; exit 1 ;;
          esac
          # The Linux-hosted "NDI SDK for Android" is a .tar.gz holding a self-extracting installer
          # script (licence shown by the script, accepted by the repository owner when downloading).
          # Extract its embedded payload without running it when the archive marker is present.
          if ! find x -type f -name Processing.NDI.Lib.h | grep -q .; then
            find x -type f -name "*.sh" | while read -r sh; do
              echo "Found installer script: $sh"
              mkdir -p x/payload
              line="$(grep -an '^__NDI_ARCHIVE_BEGIN__' "$sh" | head -n1 | cut -d: -f1 || true)"
              if [ -n "$line" ]; then
                tail -n +"$((line + 1))" "$sh" > x/payload.bin
                tar -xzf x/payload.bin -C x/payload 2>/dev/null || tar -xf x/payload.bin -C x/payload
              else
                echo "::error::Installer script has no __NDI_ARCHIVE_BEGIN__ marker; first lines follow so the extraction can be adapted."
                head -n 40 "$sh" | grep -av "^[[:space:]]*$" | head -n 40
              fi
            done
          fi
          find x -maxdepth 5 > "$RUNNER_TEMP/ndi/files.txt"; grep -E "/(lib|bin)/|\.so$" "$RUNNER_TEMP/ndi/files.txt" || true
          header="$(find x -type f -name Processing.NDI.Lib.h -print -quit)"
          if [ -z "$header" ]; then echo "::error::Processing.NDI.Lib.h not found in the NDI SDK archive"; exit 1; fi
          root="$(dirname "$(dirname "$header")")"
          echo "SDK root inside archive: $root"
          dest="$GITHUB_WORKSPACE/third_party/ndi-sdk"
          cp -r "$root/include" "$dest/"
          mkdir -p "$dest/lib"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            so="$(find "$root" -path "*${abi}*" -name libndi.so -print -quit)"
            if [ -n "$so" ]; then mkdir -p "$dest/lib/$abi"; cp -L "$so" "$dest/lib/$abi/libndi.so"; echo "found $abi: $so"; fi
          done
          ls -lR "$dest/lib"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android build tools, NDK and CMake
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;35.0.0" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing (optional)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${SIGNING_KEYSTORE_BASE64}" ]; then
            echo "${SIGNING_KEYSTORE_BASE64}" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "HAS_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "Release signing not configured; only the debug APK will be built."
          fi

      - name: Build NDI debug APK
        run: ./gradlew --no-daemon --stacktrace -Pndi.abis="${NDI_ABIS}" -PversionCode="${{ github.run_number }}" testDebugUnitTest assembleDebug

      - name: Build NDI release APK + Google Play bundle (AAB)
        if: env.HAS_SIGNING == 'true'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace -Pndi.abis="${NDI_ABIS}" -PversionCode="${{ github.run_number }}" assembleRelease bundleRelease

      - name: Check 16 KB page-size alignment of native libraries
        run: |
          set -euo pipefail
          bad=0
          for so in third_party/ndi-sdk/lib/*/libndi.so $(find app/build/intermediates -path "*stripped_native_libs*" -name "*.so" | sort -u); do
            [ -f "$so" ] || continue
            case "$so" in *x86/*|*armeabi-v7a/*) continue ;; esac   # 16 KB applies to 64-bit ABIs
            min="$(readelf -lW "$so" | awk '$1=="LOAD"{print $NF}' | sort -u | head -n1)"
            echo "$so LOAD align: $min"
            if [ $((min)) -lt $((0x4000)) ]; then echo "::warning file=$so::LOAD segments aligned to $min (< 16 KB). Google Play requires 16 KB alignment for 64-bit libraries."; bad=1; fi
          done
          [ "$bad" = 0 ] && echo "All checked 64-bit libraries are 16 KB aligned."

      - name: Verify APK contents (NDI bridge + libndi present)
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/LCSCam-NDI-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then cp app/build/outputs/apk/release/app-release.apk out/LCSCam-NDI-release.apk; fi
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab out/LCSCam-NDI-release-play.aab
            for abi in $(echo "${NDI_ABIS}" | tr ',' ' '); do
              unzip -l out/LCSCam-NDI-release-play.aab | grep -q "base/lib/$abi/libndi.so" || { echo "::error::AAB is missing base/lib/$abi/libndi.so"; exit 1; }
            done
          fi
          for apk in out/*.apk; do
            echo "== $apk"; unzip -l "$apk" | grep "lib/"
            for abi in $(echo "${NDI_ABIS}" | tr ',' ' '); do
              unzip -l "$apk" | grep -q "lib/$abi/libndi.so" || { echo "::error::$apk is missing lib/$abi/libndi.so"; exit 1; }
              unzip -l "$apk" | grep -q "lib/$abi/libndibridge.so" || { echo "::error::$apk is missing lib/$abi/libndibridge.so"; exit 1; }
            done
          done

      - name: Remove SDK and keystore from runner
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/third_party/ndi-sdk/include" "$GITHUB_WORKSPACE/third_party/ndi-sdk/lib" "$RUNNER_TEMP/ndi" "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: ndi-apk
          path: |
            out/*.apk
            out/*.aab
          retention-days: 30

  # ---------------------------------------------------------------------------------------
  # 3) Google Play upload (manual only). Runs when the workflow is started by hand with a
  #    play_track other than "none". Uploads the signed AAB as a DRAFT release: nothing is
  #    rolled out to users until you review and roll it out in Play Console.
  #    Needs secret PLAY_SERVICE_ACCOUNT_JSON (see docs/GOOGLE_PLAY.md, section 6).
  # ---------------------------------------------------------------------------------------
  play-upload:
    name: Upload AAB to Google Play (draft)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ndi-build
    if: github.event_name == 'workflow_dispatch' && inputs.play_track != 'none'
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ndi-apk
          path: out

      - name: Check upload prerequisites
        run: |
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON}" ]; then
            echo "::error title=Play upload not configured::Secret PLAY_SERVICE_ACCOUNT_JSON is not set. See docs/GOOGLE_PLAY.md section 6."
            exit 1
          fi
          if [ ! -f out/LCSCam-NDI-release-play.aab ]; then
            echo "::error title=No signed AAB::The release bundle was not built. Set the SIGNING_* secrets (docs/GOOGLE_PLAY.md section 2)."
            exit 1
          fi
          ls -l out

      - uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: id.lcscam.app
          releaseFiles: out/LCSCam-NDI-release-play.aab
          track: ${{ inputs.play_track }}
          status: draft
          releaseName: "1.0.0 (${{ github.run_number }})"

  # ---------------------------------------------------------------------------------------
  # 4) Google Play store listing (manual only). Uploads title, descriptions and images from
  #    fastlane/metadata/android with fastlane supply. Does not upload any bundle and does
  #    not change any release. Needs secret PLAY_SERVICE_ACCOUNT_JSON.
  # ---------------------------------------------------------------------------------------
  play-listing:
    name: Update Google Play store listing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' && inputs.update_listing
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - name: Check upload prerequisites
        run: |
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON}" ]; then
            echo "::error title=Play upload not configured::Secret PLAY_SERVICE_ACCOUNT_JSON is not set. See docs/GOOGLE_PLAY.md section 6."
            exit 1
          fi
          find fastlane/metadata/android -type f | sort

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Upload listing with fastlane supply
        run: |
          gem install fastlane --no-document
          fastlane supply \
            --package_name id.lcscam.app \
            --json_key_data "${PLAY_SERVICE_ACCOUNT_JSON}" \
            --metadata_path fastlane/metadata/android \
            --skip_upload_apk true --skip_upload_aab true \
            --skip_upload_changelogs true
